name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every source file parses
        run: for f in src/*.js; do node --check "$f"; done
      - name: dist matches src
        run: |
          ./build.sh
          node --check dist/personal-room-card.js
          git diff --exit-code -- dist/
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
